name: Build macOS (Intel) app

on:
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium (mac x64)
        run: npx --workspace server playwright install chromium --with-deps

      - name: Build client and package mac dmg
        run: npm run electron:dist:mac

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: domain-email-extractor-mac
          path: dist/*.dmg
