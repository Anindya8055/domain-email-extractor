name: Build macOS (Intel) app

on:
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build

      - name: Bundle server dependencies
        run: npm run prepare:server

      - name: Bundle Playwright Chromium inside the app
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: server/node_modules/.bin/playwright install chromium --only-shell

      - name: Package dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --x64

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: domain-email-extractor-mac-intel
          path: dist/*.dmg
