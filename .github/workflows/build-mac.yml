name: Build macOS apps

on:
  workflow_dispatch: {}

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intel
            runner: macos-15-intel
            arch: x64
            binary_arch: x86_64
          - name: apple-silicon
            runner: macos-15
            arch: arm64
            binary_arch: arm64
    name: build-mac (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build

      - name: Bundle server dependencies
        run: npm run prepare:server

      - name: Bundle Playwright Chromium inside the app
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: server/node_modules/.bin/playwright install chromium --only-shell

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dir --${{ matrix.arch }} --publish never

      # electron-builder edits the Electron bundle, which breaks Electron's own signature.
      # Apple Silicon refuses broken signatures (macOS reports it as malware), so re-sign
      # ad hoc: inner executables first, then the app bundle.
      - name: Ad-hoc sign app
        run: |
          set -e
          APP=$(ls -d dist/mac*/"Domain Email Extractor.app")
          echo "Signature before re-signing:"
          codesign --verify --deep --strict "$APP" && echo "valid" || echo "INVALID (expected)"
          find "$APP/Contents/Resources" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then codesign --force --sign - "$f"; fi
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create dmg
        run: |
          set -e
          APP=$(ls -d dist/mac*/"Domain Email Extractor.app")
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Domain Email Extractor" -srcfolder dmg-staging -ov -format UDZO \
            "dist/Domain-Email-Extractor-mac-${{ matrix.name }}.dmg"

      - name: Smoke test the packaged app
        run: |
          set -e
          hdiutil attach dist/*.dmg -mountpoint /tmp/dee -nobrowse
          APP="/tmp/dee/Domain Email Extractor.app"
          RES="$APP/Contents/Resources"
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/Domain Email Extractor" | tee /dev/stderr | grep -q "${{ matrix.binary_arch }}"
          SHELL_BIN=$(find "$RES/server/node_modules/playwright-core/.local-browsers" -name chrome-headless-shell -type f | head -1)
          file "$SHELL_BIN" | tee /dev/stderr | grep -q "${{ matrix.binary_arch }}"
          ELECTRON_RUN_AS_NODE=1 PLAYWRIGHT_BROWSERS_PATH=0 PORT=4100 \
            DATA_DIR=/tmp/dee-data APP_CONFIG_PATH=/tmp/dee-data/settings.json \
            "$APP/Contents/MacOS/Domain Email Extractor" "$RES/server/index.js" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4100/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:4100/api/health
          cd "$RES/server" && ELECTRON_RUN_AS_NODE=1 PLAYWRIGHT_BROWSERS_PATH=0 \
            "$APP/Contents/MacOS/Domain Email Extractor" -e "import('playwright').then(async p=>{const b=await p.chromium.launch({headless:true});const pg=await b.newPage();await pg.setContent('<p>ok</p>');console.log('chromium:',await pg.textContent('p'));await b.close()})"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: domain-email-extractor-mac-${{ matrix.name }}
          path: dist/*.dmg
